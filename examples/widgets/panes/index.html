<!doctype html>
<meta charset="utf-8">
<!-- Claude Code prints "esc to interrupt" while it runs; that marks a window as working. A peek into every tmux window of the Hatch session: its name and last lines. Handy with several Claude agents in different windows. -->
<style>
  body{margin:0;padding:6px 10px;background:var(--bg,#111);color:var(--fg,#eee);font:12px/1.45 var(--mono,monospace)}
  .w{margin:6px 0 10px} h4{margin:0 0 2px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent,#4fd1c0);font-weight:500}
  pre{margin:0;white-space:pre-wrap;word-break:break-all;opacity:.85}
</style>
<div id="out">looking...</div>
<script src="/sdk.js"></script>
<script>
  hatch.on('p', (v) => {
    if (v.error) { out.textContent = v.error; return; }
    const groups = []; for (const line of (v.out || '').split('\n')) { const m = /^@@ (\d+) (.*)$/.exec(line); if (m) groups.push({ id: m[1], name: m[2], lines: [] }); else if (groups.length) groups.at(-1).lines.push(line); }
    out.replaceChildren(...(groups.length ? groups : [{ id: '-', name: 'no tmux session found', lines: [] }]).map((g) => { const d = document.createElement('div'); d.className = 'w'; const h = document.createElement('h4'); const busy = g.lines.some((l) => /esc to interrupt/i.test(l)); h.textContent = g.id + ': ' + g.name + (busy ? '  \u25cf working' : ''); const p = document.createElement('pre'); p.textContent = g.lines.join('\n'); d.append(h, p); return d; }));
  });
</script>
