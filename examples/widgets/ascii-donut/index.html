<!doctype html>
<meta charset="utf-8">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:transparent;display:flex;align-items:center;justify-content:center}
  pre{margin:0;font:11px/11px var(--mono,monospace);color:var(--accent,#4fd1c0);white-space:pre}
</style>
<pre id="p"></pre>
<script src="/sdk.js"></script>
<script>
  // The classic spinning torus, rendered with a luminance ramp into a 60x28 character grid.
  const W = 60, H = 28, RAMP = '.,-~:;=!*#$@'; let A = 0, B = 0;
  function render() {
    const out = new Array(W * H).fill(' '), z = new Array(W * H).fill(0);
    const cA = Math.cos(A), sA = Math.sin(A), cB = Math.cos(B), sB = Math.sin(B);
    for (let th = 0; th < 6.28; th += .07) {
      const ct = Math.cos(th), st = Math.sin(th);
      for (let ph = 0; ph < 6.28; ph += .02) {
        const cp = Math.cos(ph), sp = Math.sin(ph), cx = ct + 2, d = 1 / (sp * cx * sA + st * cA + 5), t = sp * cx * cA - st * sA;
        const x = Math.floor(W / 2 + 25 * d * (cp * cx * cB - t * sB)), y = Math.floor(H / 2 + 12.5 * d * (cp * cx * sB + t * cB));
        const L = Math.floor(8 * ((st * sA - sp * ct * cA) * cB - sp * ct * sA - st * cA - cp * ct * sB)), o = x + W * y;
        if (y >= 0 && y < H && x >= 0 && x < W && d > z[o]) { z[o] = d; out[o] = RAMP[Math.max(0, L)]; }
      }
    }
    let s = ''; for (let r = 0; r < H; r++) s += out.slice(r * W, r * W + W).join('') + '\n';
    p.textContent = s;
  }
  let last = 0;
  function frame(t) {
    requestAnimationFrame(frame);
    if (document.hidden || t - last < 50) return;
    last = t; A += .04; B += .02; render();
  }
  requestAnimationFrame(frame);
</script>
